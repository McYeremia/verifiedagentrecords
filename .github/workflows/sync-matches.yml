name: Sync Match Results

on:
  schedule:
    # Runs every 15 minutes (GitHub minimum is 5 min, but 15 is more reliable)
    - cron: '*/15 * * * *'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger match sync
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.APP_URL }}/api/matches/sync")
          echo "Sync response status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Sync returned $STATUS — check logs"
            exit 1
          fi

      - name: Log result
        if: always()
        run: echo "Sync job finished at $(date -u)"
